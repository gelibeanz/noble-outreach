name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild@0.23.4
      - name: Install windres (launcher exe icon)
        run: sudo apt-get update && sudo apt-get install -y binutils-mingw-w64-x86-64
      - name: Test
        run: cargo test --locked -p reach-master -p reach-launcher
      - name: Build (Windows host + launcher, Linux launcher, musl master)
        run: |
          cargo zigbuild --release --locked --target x86_64-pc-windows-gnu -p reach-host -p reach-launcher
          cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.31 -p reach-launcher
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl -p reach-master
