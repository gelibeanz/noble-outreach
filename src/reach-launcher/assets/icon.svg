<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Noble Outreach app icon: a chevron rising off a planet's horizon. Original art (GPL-3.0 with the project). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a2a3d"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7c99"/>
      <stop offset="0.35" stop-color="#2c4259"/>
      <stop offset="1" stop-color="#121c29"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e8711c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="44"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" fill="url(#sky)"/>
    <circle cx="200" cy="52" r="3" fill="#cfe3f5" opacity="0.8"/>
    <circle cx="58" cy="70" r="2" fill="#cfe3f5" opacity="0.6"/>
    <circle cx="178" cy="98" r="1.6" fill="#cfe3f5" opacity="0.5"/>
    <rect x="8" y="60" width="240" height="190" fill="url(#glow)"/>
    <!-- planet -->
    <circle cx="128" cy="420" r="250" fill="url(#planet)"/>
    <circle cx="128" cy="420" r="250" fill="none" stroke="#9fd0ff" stroke-width="3" opacity="0.7"/>
  </g>
  <!-- chevron -->
  <path d="M 128 40 L 212 134 L 174 134 L 128 82 L 82 134 L 44 134 Z" fill="url(#chev)"/>
  <path d="M 128 122 L 178 178 L 146 178 L 128 158 L 110 178 L 78 178 Z" fill="url(#chev)" opacity="0.9"/>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
