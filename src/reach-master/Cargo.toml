[package]
name = "reach-master"
version = "0.4.1"
edition = "2021"
description = "Master server for reach-host: servers register by heartbeat, clients list them (JSON over HTTP)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
