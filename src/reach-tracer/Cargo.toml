[package]
name = "reach-tracer"
version = "0.4.2"
edition = "2021"
description = "Proxy haloreach.dll: records how MCC drives the Reach engine (launch options, host callbacks)"

[lib]
name = "haloreach"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory"] }
